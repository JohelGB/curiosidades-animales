<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#123a9e}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#2f63e0 0%,#1f4fc9 45%,#143aa0 100%)}
  svg{position:absolute;left:0;top:0}
  #tag{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:'Inter',sans-serif;font-weight:800;
    font-size:40px;color:#ffe066;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,40,.5)}
  #cap{position:absolute;left:40px;right:40px;top:1330px;text-align:center;font-family:'Inter Display','Inter',sans-serif;
    font-weight:900;font-size:118px;line-height:1.02;color:#fff;letter-spacing:-1px;text-transform:uppercase;
    -webkit-text-stroke:14px #0a0f2a;paint-order:stroke fill;transform-origin:center center}
  #cap .hl{color:#ffd23f}
  #logo{position:absolute;left:290px;top:760px;width:500px;height:500px;border-radius:50%;
    border:14px solid #ffe066;box-shadow:0 20px 50px rgba(0,0,0,.35);opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head>
<body><div id="stage">
  <svg width="1080" height="1920" id="gridsvg">
    <defs>
      <pattern id="g1" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0 L0 0 0 45" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/></pattern>
      <pattern id="g2" width="225" height="225" patternUnits="userSpaceOnUse"><path d="M225 0 L0 0 0 225" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/></pattern>
    </defs>
    <g id="gridg"><rect x="-1080" y="-1920" width="3240" height="5760" fill="url(#g1)"/><rect x="-1080" y="-1920" width="3240" height="5760" fill="url(#g2)"/></g>
  </svg>
  <svg width="1080" height="1920" id="art">
    <defs>
      <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="4"/></pattern>
      <pattern id="hatchy" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" stroke="rgba(255,210,63,.7)" stroke-width="4"/></pattern>
      <marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fff"/></marker>
      <marker id="arwy" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffd23f"/></marker>
      <marker id="arwr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker>
    </defs>
    <g id="world"><g id="base"></g><g id="ovs"></g></g>
  </svg>
  <div id="tag">CURIOSIDADES ANIMALES</div>
  <div id="cap"></div>
  <img id="logo" src="logo.png">
  <div id="flash"></div>
</div>
<script src="spec.js"></script>
<script>
const S=window.SPEC;const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
$('base').innerHTML=S.baseArt;
const ovs=S.scenes.map((sc,i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=sc.overlay||'';$('ovs').appendChild(g);return g;});
function prep(root){const strokes=[],fills=[],pops=[],flows=[];
  root.querySelectorAll('path,line,polyline,polygon,circle,ellipse,rect,text').forEach((el,idx)=>{
    if(el.closest('defs'))return;
    if(el.classList.contains('flow')){el.setAttribute('pathLength',1);el.setAttribute('stroke-dasharray','0.03 0.05');flows.push(el);return;}
    if(el.classList.contains('pop')||el.tagName==='text'){pops.push(el);return;}
    const st=el.getAttribute('stroke');const f=el.getAttribute('fill');
    if(st&&st!=='none'){el.setAttribute('pathLength',1);el.setAttribute('stroke-dasharray','1 1');strokes.push(el);}
    if(f&&f!=='none')fills.push(el);});
  return {strokes,fills,pops,flows};}
const baseP=prep($('base'));const ovP=ovs.map(prep);
function drawOn(P,lt,dur){const n=P.strokes.length;
  P.strokes.forEach((el,i)=>{const st=(i/Math.max(1,n))*dur*0.5;const k=ease(clamp((lt-st)/(dur*0.6),0,1));el.setAttribute('stroke-dashoffset',1-k);});
  P.fills.forEach(el=>{el.style.opacity=clamp((lt-dur*0.5)/0.4,0,1);});
  const np=P.pops.length;P.pops.forEach((el,i)=>{const dl=dur*0.3+(i/Math.max(1,np))*0.9;const k=easeOutBack(clamp((lt-dl)/0.3,0,1));el.style.opacity=clamp((lt-dl)/0.1,0,1);
    const bb=el.getBBox();const cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;el.setAttribute('transform',`translate(${cx} ${cy}) scale(${Math.max(0.001,k)}) translate(${-cx} ${-cy})`);});}
function flowAnim(P,t,on){P.flows.forEach(el=>{el.style.opacity=on;el.setAttribute('stroke-dashoffset',(-t*0.6)%1);});}
// captions
const words=[];S.scenes.forEach(sc=>(sc.words||[]).forEach(w=>words.push(w)));
const chunks=[];let cur=null;
words.forEach((w,i)=>{const len=(cur?cur.text.length:0)+w.w.length;
  if(!cur||cur.ws.length>=2||len>13||w.first){cur={ws:[],text:'',s:w.s};chunks.push(cur);}
  cur.ws.push(w);cur.text+=w.w+' ';});
chunks.forEach((c,i)=>{c.e=i<chunks.length-1?chunks[i+1].s:1e9;});
let lastChunk=-1,lastScene=-1;
function render(t){
  let si=S.scenes.findIndex(s=>t>=s.s&&t<s.e);if(si<0)si=S.scenes.length-1;const sc=S.scenes[si];const lt=t-sc.s,len=sc.e-sc.s;
  const isCTA=!!sc.cta;
  // camera
  const prev=si>0?S.scenes[si-1].cam||{x:540,y:1000,z:1}:{x:540,y:1000,z:0.92};const cam=sc.cam||{x:540,y:1000,z:1};
  const k=ease(clamp(lt/0.55,0,1));let cx=lerp(prev.x,cam.x,k),cy=lerp(prev.y,cam.y,k),z=lerp(prev.z,cam.z,k);
  z*=1+0.035*clamp(lt/len,0,1);cx+=(cam.dx||0)*clamp(lt/len,0,1);
  const sy=sc.screenY||900;
  $('world').setAttribute('transform',`translate(540 ${sy}) scale(${z}) translate(${-cx} ${-cy})`);
  $('gridg').setAttribute('transform',`translate(${(-cx*0.3)%225} ${(-cy*0.3)%225})`);
  // base draw-on during scene 0, then fully drawn
  drawOn(baseP,si===0?lt:99,1.4);
  $('base').style.opacity=isCTA?0:(sc.baseOpacity??1);
  ovs.forEach((g,i)=>{const vis=i===si||(S.scenes[si].keep||[]).includes(i);g.style.display=vis?'':'none';
    if(vis){drawOn(ovP[i],i===si?lt:99,sc.drawDur||1.0);flowAnim(ovP[i],t,1);}});
  // flash on cut
  $('flash').style.opacity=si>0?clamp(0.35-lt*1.6,0,0.35):0;
  // captions
  let ci=chunks.findIndex(c=>t>=c.s&&t<c.e);const cap=$('cap');
  if(isCTA&&false){}
  if(ci>=0){if(ci!==lastChunk){cap.innerHTML=chunks[ci].ws.map(w=>w.hl?`<span class="hl">${w.w}</span>`:w.w).join(' ');lastChunk=ci;}
    const ck=clamp((t-chunks[ci].s)/0.12,0,1);cap.style.opacity=t<chunks[ci].s+0.01?0:1;cap.style.transform=`scale(${lerp(0.7,1,easeOutBack(ck))})`;}
  else cap.style.opacity=0;
  if(isCTA){cap.style.top='1380px';}else cap.style.top='1330px';
  // logo
  const lg=$('logo');if(isCTA){const lk=easeOutBack(clamp(lt/0.6,0,1));lg.style.opacity=clamp(lt/0.2,0,1);lg.style.transform=`scale(${lk}) rotate(${Math.sin(t*2)*3}deg)`;}else lg.style.opacity=0;
}
window.render=render;render(0);
</script></body></html>
