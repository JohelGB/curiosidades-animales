name: Descargar fotos y videos reales
on:
  push:
    paths: ['media/pedidos.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: media, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 tools/fetch_media.py 2>&1 | tee media/_ultimo_log.txt
      - run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add media
          git diff --cached --quiet || (git commit -m "Media descargada" && git pull --rebase origin main && git push)
